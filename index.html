<!DOCTYPE html>
<html>
<head>

<title>Study Material Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

    <h1 class="brand">📚 Study Material</h1>
    <h2 id="ndacdsafcat">NDA/CDS/AFCAT</h2>
    <h3 id="subhead">100+ mock tests</h3>
    <h3 id="subhead">PYQ booklets of 15 years</h3>
    <h3 id="subhead">complete guide for SSB (AFPA)</h3>

    <hr class="divider">

    <h2 class="login-title">Log in</h2>

    <form id="loginForm" onsubmit="login(event)">

        <label for="email">Username or Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="pass">Password</label>
        <div class="password-wrap">
            <input type="password" id="pass" placeholder="Enter your password" required>
            <button type="button" class="show-btn" onclick="togglePassword()">Show</button>
        </div>

        <button type="submit" class="login-btn">Log in</button>

    </form>

    <p class="helper-links">
        <a href="#">Forgot password?</a>
    </p>

</div>

<h2 class="quote">
"Discipline today creates success tomorrow."
</h2>

<script src="script.js"></script>
</body>
</html>
